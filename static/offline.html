<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f78">
  <title>Offline | JeevanSetu AI</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #f6f9f7; color: #183632; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 460px); padding: 32px; border: 1px solid #e5eeeb; border-radius: 22px; background: #fff; text-align: center; }
    img { width: 58px; height: 58px; }
    h1 { margin: 18px 0 8px; font-size: 1.7rem; }
    p { color: #6a817c; }
    button { min-height: 44px; margin-top: 10px; border: 0; border-radius: 11px; padding: 0 18px; background: #087f78; color: #fff; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/jeevansetu.svg" alt="">
    <h1>You’re offline</h1>
    <p>JeevanSetu AI needs an internet connection to load directory data and securely access your account. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
